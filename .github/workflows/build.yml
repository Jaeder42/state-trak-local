# Build flow: nothing happens on ordinary pushes (private-repo runner
# minutes); PRs run lint + server; version tags additionally publish the
# server binaries to the release.
#
# The desktop apps live in their own per-OS release flows (see
# release-macos.yml / release-windows.yml / release-linux.yml): every tag
# publishes all platforms, and each OS can also be built — and published —
# standalone via manual dispatch.
#
# No secrets needed: the app is bring-your-own-keys (JEV/LLM), and the macOS
# app is ad-hoc self-signed by wails (recipients right-click -> Open on first
# launch; real notarization would need Apple Developer secrets added later).
#
# Triggering a full release: git tag v0.1.0 && git push origin v0.1.0
# (all four workflows fire; each publishes its own artifacts idempotently)

name: build

on:
  push:
    tags: ["v*"] # no ordinary branch pushes — CI costs minutes on a private repo
  pull_request:
  workflow_dispatch:
    # manual runs are independently selectable — uncheck what you don't want
    inputs:
      server:
        description: Server binaries (cross-compile + smoke test)
        type: boolean
        default: true

env:
  WAILS_VERSION: v2.16.0

defaults:
  run:
    shell: bash

jobs:
  lint:
    # cheap invariant — always runs (gofmt + go vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...

  server:
    # cheap (Linux only): React client + pure-Go cross-compiled binaries.
    # Deliberately not gated on lint — manual runs must be able to run it
    # alone (failed/skipped `needs` would cascade-skip it).
    if: github.event_name != 'workflow_dispatch' || inputs.server == true
    runs-on: ubuntu-latest
    permissions:
      contents: write # release upload on tag pushes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: build client
        run: |
          cd client && npm ci && npm run build && cd ..
          rm -rf web/dist && cp -r client/build web/dist && touch web/dist/.gitkeep
      - name: cross-compile server binaries
        run: make release
      - name: smoke test (boot + /ping)
        run: |
          STATETRAK_NO_OPEN=1 ./release/statetrak-linux-amd64 -addr=:3011 &
          for i in $(seq 1 20); do
            if curl -sf localhost:3011/ping >/dev/null; then echo "server ok"; exit 0; fi
            sleep 0.5
          done
          echo "server did not come up"; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: server-binaries
          path: release/*
          if-no-files-found: error
      - name: publish server binaries to the release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --generate-notes \
            || gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "failed to create or find release $TAG"; exit 1; }
          gh release upload "$TAG" release/* --clobber
          echo "published server binaries to release $TAG"