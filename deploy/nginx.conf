# StateTrak — nginx site config.
#
# If you already run nginx + certbot on this box, the only *required* pieces
# are the three marked blocks (auth, body size, proxy). Everything else is the
# standard TLS scaffolding that your existing server block probably has.
#
# 1. Create the password file (one line per friend):
#        apt install -y apache2-utils
#        htpasswd -c /etc/nginx/.htpasswd friend        # first user (-c = create)
#        htpasswd /etc/nginx/.htpasswd secondfriend     # add more
# 2. Merge into your certbot-managed server block for the domain
#    (or drop this file in sites-available + symlink, then adapt TLS paths).
# 3. nginx -t && systemctl reload nginx

server {
    listen 80;
    listen 443 ssl;
    server_name demo.example.com;

    # --- TLS: let certbot manage these if you use it (sudo certbot --nginx) ---
    ssl_certificate     /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;

    # --- REQUIRED: auth (the app has none of its own) ---
    auth_basic "StateTrak";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # --- REQUIRED: demo uploads are hundreds of MB; nginx's default body
    #     limit is 1 MB and would 413 every upload ---
    client_max_body_size 1G;

    location / {
        # --- REQUIRED: the app listens on loopback only ---
        proxy_pass http://127.0.0.1:3007;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # First JEV analysis call runs several seconds; slow mobile uploads
        # take a while too — keep timeouts generous.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}